

services:
  app:
    image: o19s/quepid:nightly
    container_name: quepid_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DOCKER_CONTAINER=true
      - RAILS_ENV=production
      - RACK_ENV=production
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - DATABASE_URL=mysql2://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - QUEPID_DOMAIN=${QUEPID_DOMAIN:-http://localhost}
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      - SIGNUP_ENABLED=${SIGNUP_ENABLED:-true}
      - QUEPID_DEFAULT_SCORER=${QUEPID_DEFAULT_SCORER:-AP@10}
    ports:
      - "80:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./log:/log

  mysql:
    env_file:
      - .env
    image: mysql:8.4.3
    container_name: quepid_db
    restart: unless-stopped
    ports:
      - "3306:3306"

    volumes:
      - quepid_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  quepid_mysql:



services:
  app:
    image: o19s/quepid:nightly
    container_name: quepid_app
    restart: unless-stopped
    env_file:
      - ./quepid-init/corenv
    environment:
      - DOCKER_CONTAINER=true
      - RAILS_ENV=production
      - RACK_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
    ports:
      - "80:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./log:/log

  mysql:
    env_file:
      - ./quepid-init/corenv
    image: mysql:8.4.3
    container_name: quepid_db
    restart: unless-stopped
    ports:
      - "3306:3306"

    volumes:
      - quepid_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  quepid_mysql:

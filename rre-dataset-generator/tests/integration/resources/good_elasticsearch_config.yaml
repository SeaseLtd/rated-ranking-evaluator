query_template: > 
  {
      "size": 2,
      "query": { 
          "match": { 
              "description": "#$query##" 
          } 
      } 
  }
search_engine_type: "elasticsearch"
index_name: "testcore"
search_engine_collection_endpoint: 'http://localhost:9200/testcore/'
documents_filter:
  - title:
      - "and"
doc_number: 2
doc_fields:
  - "title"
  - "description"
generate_queries_from_documents: true
num_queries_needed: 4
relevance_scale: "graded"
llm_configuration_file: "tests/unit/resources/llm_config.yaml"
output_format: "quepid"
output_destination: "output/generated_dataset.json"

query_template: > 
    {
        "query": { 
            "match": { 
                "message": "#$query##" 
            } 
        } 
    }
search_engine_type: "elasticsearch"
collection_name: "testcore"
search_engine_url: 'http://localhost:9200/'
doc_number: 100
doc_fields:
  - "title"
  - "description"
queries: "dataset-generator/tests/unit/resources/queries.txt"
generate_queries_from_documents: true
num_queries_needed: 10
relevance_scale: "graded"
llm_configuration_file: "dataset-generator/tests/unit/resources/llm_config.yaml"
output_format: "quepid"
output_destination: "output"

